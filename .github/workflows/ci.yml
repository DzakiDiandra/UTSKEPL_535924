name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Siapkan environment
        run: cp .env.example .env && php artisan key:generate
      - name: Jalankan test backend
        run: php artisan test
      - name: Periksa format dengan Pint
        run: vendor/bin/pint --test

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Jalankan lint
        run: npm run lint
      - name: Jalankan unit test
        run: npm run test:unit -- --run
      - name: Build frontend
        run: npm run build

  deploy:
    name: deploy
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Siapkan nama image
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"
      - name: Samarkan dan periksa rahasia
        run: |
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$DB_PASSWORD"
          test -n "$APP_KEY"
          test -n "$DB_PASSWORD"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login ke GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build dan push backend
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      - name: Build dan push frontend
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
      - name: Siapkan jaringan sementara
        run: docker network create jaringan-uji
      - name: Jalankan MySQL
        run: |
          docker run -d --name uji-db --network jaringan-uji \
            -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" \
            -e MYSQL_DATABASE=toko_hp \
            -e MYSQL_USER=toko \
            -e MYSQL_PASSWORD="$DB_PASSWORD" \
            mysql:8.4
          for attempt in $(seq 1 60); do
            if docker exec uji-db mysqladmin ping -h 127.0.0.1 -uroot -p"$DB_PASSWORD" --silent >/dev/null 2>&1; then
              echo "MySQL siap setelah ${attempt} percobaan."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL tidak siap."
          docker logs uji-db
          exit 1
      - name: Jalankan backend
        run: |
          docker run -d --name uji-api --network jaringan-uji -p 8000:8000 \
            -e APP_KEY="$APP_KEY" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=uji-db \
            -e DB_PORT=3306 \
            -e DB_DATABASE=toko_hp \
            -e DB_USERNAME=toko \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e ADMIN_PASSWORD=password \
            "${BACKEND_IMAGE}:${{ github.sha }}"
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' uji-api 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "Backend sehat setelah ${attempt} percobaan."
              exit 0
            fi
            sleep 2
          done
          echo "Backend tidak sehat."
          docker logs uji-api
          exit 1
      - name: Smoke test backend
        run: |
          curl -fsS http://localhost:8000/up > /dev/null
          kode_tanpa_token=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/produk)
          test "$kode_tanpa_token" = "401"
          kode_login=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/login \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{"email":"admin@example.com","password":"password"}')
          test "$kode_login" = "200"
          echo "Backend merespons dengan benar."
      - name: Jalankan frontend dan cek halaman utama
        run: |
          docker run -d --name uji-web --network jaringan-uji -p 8080:8080 "${FRONTEND_IMAGE}:${{ github.sha }}"
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080 > /dev/null; then
              echo "Frontend merespons setelah ${attempt} percobaan."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend tidak merespons."
          docker logs uji-web
          exit 1
      - name: Cek proxy frontend ke backend
        run: |
          kode_login=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/login \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{"email":"admin@example.com","password":"password"}')
          test "$kode_login" = "200"
          echo "Proxy frontend ke backend berjalan."
      - name: Bersihkan sumber daya uji
        if: always()
        run: |
          docker rm -f uji-api uji-web uji-db 2>/dev/null || true
          docker network rm jaringan-uji 2>/dev/null || true
