name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Siapkan environment
        run: cp .env.example .env && php artisan key:generate
      - name: Periksa format dengan Pint
        run: vendor/bin/pint --test
      - name: Jalankan test backend
        run: php artisan test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Jalankan lint
        run: npm run lint
      - name: Jalankan unit test
        run: npm run test:unit -- --run
      - name: Build frontend
        run: npm run build

  publish:
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Siapkan nama image
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login ke GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build dan push backend
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
      - name: Build dan push frontend
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=http://localhost:8000/api
            VITE_WA_NUMBER=${{ vars.VITE_WA_NUMBER || '6281234567890' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
    steps:
      - name: Siapkan nama image
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"
      - name: Samarkan APP_KEY di log
        run: echo "::add-mask::$APP_KEY"
      - name: Pastikan APP_KEY tersedia
        run: test -n "$APP_KEY"
      - name: Login ke GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tarik image berdasarkan tag commit
        run: |
          docker pull "${BACKEND_IMAGE}:${{ github.sha }}"
          docker pull "${FRONTEND_IMAGE}:${{ github.sha }}"
      - name: Jalankan backend dan tunggu sehat
        run: |
          docker run -d --name api \
            -p 8000:8000 \
            -e APP_KEY="$APP_KEY" \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/app/database/database.sqlite \
            "${BACKEND_IMAGE}:${{ github.sha }}"
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "Backend sehat setelah ${attempt} percobaan."
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Smoke test backend
        run: |
          curl -fsS http://localhost:8000/up > /dev/null
          curl -fsS http://localhost:8000/api/produk > /dev/null
      - name: Jalankan frontend dan cek halaman utama
        run: |
          docker run -d --name web -p 8080:8080 "${FRONTEND_IMAGE}:${{ github.sha }}"
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8080 > /dev/null; then
              echo "Frontend merespons setelah ${attempt} percobaan."
              exit 0
            fi
            sleep 2
          done
          docker logs web
          exit 1
      - name: Hentikan semua container
        if: always()
        run: docker rm -f api web 2>/dev/null || true
