name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Siapkan environment
        run: cp .env.example .env && php artisan key:generate
      - name: Periksa format dengan Pint
        run: vendor/bin/pint --test
      - name: Jalankan test backend
        run: php artisan test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Jalankan lint
        run: npm run lint
      - name: Jalankan unit test
        run: npm run test:unit -- --run
      - name: Build frontend
        run: npm run build
